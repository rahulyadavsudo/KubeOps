apiVersion: v1
kind: Namespace
metadata:
  name: kubeops-mesh
  labels:
    istio-injection: enabled
---
# ====================================================
# 1. API Gateway / BFF (Node.js)
# ====================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeops-api-gateway
  namespace: kubeops-mesh
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubeops-api-gateway
  template:
    metadata:
      labels:
        app: kubeops-api-gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/kubeops/api-gateway:v2.4.0
          ports:
            - containerPort: 3000
          env:
            - name: COLLECTOR_GRPC_URL
              value: "kubeops-collector:50051"
            - name: TELEMETRY_GRPC_URL
              value: "kubeops-telemetry:50052"
            - name: ARGO_GRPC_URL
              value: "kubeops-argo-controller:50053"
            - name: AI_DIAGNOSTICS_URL
              value: "http://kubeops-ai-diagnostics:50054"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kubeops-api-gateway
  namespace: kubeops-mesh
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app: kubeops-api-gateway
---
# ====================================================
# 2. K8s Collector Service (Go)
# ====================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeops-collector
  namespace: kubeops-mesh
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubeops-collector
  template:
    metadata:
      labels:
        app: kubeops-collector
    spec:
      serviceAccountName: kubeops-collector-sa
      containers:
        - name: collector
          image: ghcr.io/kubeops/k8s-collector:v2.4.0
          ports:
            - containerPort: 50051
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kubeops-collector
  namespace: kubeops-mesh
spec:
  type: ClusterIP
  ports:
    - port: 50051
      targetPort: 50051
      name: grpc
  selector:
    app: kubeops-collector
---
# ====================================================
# 3. Prometheus Telemetry Aggregator (Go)
# ====================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeops-telemetry
  namespace: kubeops-mesh
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubeops-telemetry
  template:
    metadata:
      labels:
        app: kubeops-telemetry
    spec:
      containers:
        - name: telemetry
          image: ghcr.io/kubeops/telemetry-service:v2.4.0
          ports:
            - containerPort: 50052
          env:
            - name: PROMETHEUS_URL
              value: "http://prometheus-k8s.monitoring.svc:9090"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kubeops-telemetry
  namespace: kubeops-mesh
spec:
  type: ClusterIP
  ports:
    - port: 50052
      targetPort: 50052
      name: grpc
  selector:
    app: kubeops-telemetry
---
# ====================================================
# 4. Argo CD & Rollout Controller (Go)
# ====================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeops-argo-controller
  namespace: kubeops-mesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeops-argo-controller
  template:
    metadata:
      labels:
        app: kubeops-argo-controller
    spec:
      containers:
        - name: controller
          image: ghcr.io/kubeops/argo-controller:v2.4.0
          ports:
            - containerPort: 50053
          env:
            - name: ARGOCD_SERVER
              value: "https://argocd-server.argocd.svc:443"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kubeops-argo-controller
  namespace: kubeops-mesh
spec:
  type: ClusterIP
  ports:
    - port: 50053
      targetPort: 50053
      name: grpc
  selector:
    app: kubeops-argo-controller
---
# ====================================================
# 5. SRE AI Diagnostics Engine (Python)
# ====================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeops-ai-diagnostics
  namespace: kubeops-mesh
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubeops-ai-diagnostics
  template:
    metadata:
      labels:
        app: kubeops-ai-diagnostics
    spec:
      containers:
        - name: ai-engine
          image: ghcr.io/kubeops/ai-diagnostics:v2.4.0
          ports:
            - containerPort: 50054
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kubeops-secrets
                  key: gemini-api-key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kubeops-ai-diagnostics
  namespace: kubeops-mesh
spec:
  type: ClusterIP
  ports:
    - port: 50054
      targetPort: 50054
      name: http
  selector:
    app: kubeops-ai-diagnostics
