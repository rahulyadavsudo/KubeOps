apiVersion: v1
kind: Namespace
metadata:
  name: kubeops-system
  labels:
    name: kubeops-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeops-platform
  namespace: kubeops-system
  labels:
    app.kubernetes.io/name: kubeops
    app.kubernetes.io/part-of: kubeops-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubeops
  template:
    metadata:
      labels:
        app: kubeops
    spec:
      containers:
        - name: kubeops
          # Replace <YOUR_DOCKERHUB_USERNAME> with your actual Docker Hub username
          image: <YOUR_DOCKERHUB_USERNAME>/kubeops:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kubeops-secrets
                  key: gemini-api-key
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kubeops-service
  namespace: kubeops-system
spec:
  type: ClusterIP
  selector:
    app: kubeops
  ports:
    - name: http
      port: 80
      targetPort: 3000
